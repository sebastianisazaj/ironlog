<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <title>IronLog</title>
  <meta name="description" content="Workout tracker with programs, PRs and a workout builder. English / Español.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="IronLog">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply theme before first paint to avoid a flash
    try {
      const p = (JSON.parse(localStorage.getItem('ironlog.v1')) || {}).profile || {};
      const th = p.theme && p.theme !== 'auto' ? p.theme : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = th;
    } catch {}
  </script>
</head>
<body>
  <div class="orbs" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <header class="topbar">
    <div class="brand"><img src="icon.svg" alt="" width="30" height="30"> IronLog</div>
    <button class="active-pill hidden" id="activePill" data-go="workout">● <span id="activeTimer">0:00</span></button>
    <button class="round-btn" id="langBtn" data-act="toggleLang">ES</button>
    <button class="round-btn" id="themeBtn" data-act="toggleTheme"></button>
    <button class="round-btn" data-go="tools" data-i18n-aria="nav.tools">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01M16 18h.01"/></svg>
    </button>
    <button class="round-btn" data-go="settings" data-i18n-aria="nav.settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
    </button>
  </header>

  <main id="view"></main>

  <nav class="tabbar" id="tabbar">
    <div class="tab-ind" id="tabInd"></div>
    <button data-go="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg><span data-i18n="nav.home">Home</span></button>
    <button data-go="programs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4M12 16h4M8 11h.01M8 16h.01"/></svg><span data-i18n="nav.programs">Programs</span></button>
    <button data-go="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span data-i18n="nav.library">Exercises</span></button>
    <button data-go="workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11M21 21l-1-1M3 3l1 1M18 22l4-4M2 6l4-4M3 10l7-7M14 21l7-7"/></svg><span data-i18n="nav.workout">Workout</span></button>
    <button data-go="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 7l-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/></svg><span data-i18n="nav.progress">Progress</span></button>
    <button data-go="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg><span data-i18n="nav.calendar">Calendar</span></button>
  </nav>

  <div class="rest-timer hidden" id="restTimer">
    <div class="rest-ring"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" class="bg"/><circle cx="18" cy="18" r="16" class="fg" id="restArc"/></svg><span id="restText">1:30</span></div>
    <button data-rest="-15">−15</button>
    <button data-rest="15">+15</button>
    <button data-rest="skip" data-i18n="skip">Skip</button>
  </div>

  <div class="modal hidden" id="modal"><div class="sheet" id="sheet"></div></div>
  <div class="toasts" id="toasts"></div>
  <canvas id="confetti"></canvas>

  <script src="icons.js"></script>
  <script src="i18n.js"></script>
  <script src="programs.js"></script>
  <script src="app.js"></script>
</body>
</html>
